name: Build full Blender 5.2 iPad M4 IPA

on:
  push:
    branches:
      - upgrade/ios-5.2-m4-full
    paths:
      - .github/workflows/build-unsigned-ipa.yml
      - scripts/**
      - patches/**
      - README.md
  pull_request:
    branches:
      - upgrade/ios-5.2-m4-full
    paths:
      - .github/workflows/build-unsigned-ipa.yml
      - scripts/**
      - patches/**
      - README.md
  workflow_dispatch:

concurrency:
  group: blender-5.2-ipad-m4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Blender 5.2 LTS / iPadOS 27 / M4 full profile
    runs-on: macos-15
    timeout-minutes: 360

    env:
      BLENDER_REF: 2bc556e58e82eb3a801895f2cb1881c0267e5cd5
      BUNDLE_ID: com.gorillafkngorgeous.blenderipad52
      SOURCE_DIR: ${{ github.workspace }}/work/blender
      BUILD_DIR: ${{ github.workspace }}/work/build-ios
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out build harness
        uses: actions/checkout@v4

      - name: Select Xcode 26.3 and iOS 26 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)" -ge 26
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check Apple-silicon host tools and capacity
        run: |
          test "$(uname -m)" = arm64
          uname -a
          cmake --version
          git lfs version
          sysctl -n hw.ncpu
          df -h

      - name: Prepare pinned Blender 5.2 iOS source and libraries
        run: bash ./scripts/prepare-source.sh "$SOURCE_DIR"

      - name: Restore Python 3.13 and codec dependency cache
        id: ios-bootstrap-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/blender/lib/ios_arm64/python
            work/blender/lib/ios_arm64/ssl
            work/blender/lib/ios_arm64/ffi
            work/blender/lib/ios_arm64/sqlite
            work/blender/lib/ios_arm64/zlib
            work/blender/lib/ios_arm64/bzip2
            work/blender/lib/ios_arm64/lzma
            work/blender/lib/ios_arm64/libb2
            work/blender/lib/ios_arm64/draco
            work/blender/lib/ios_arm64/meshoptimizer
          key: ios-5.2-bootstrap-${{ runner.os }}-xcode-26.3-${{ env.BLENDER_REF }}-python-3.13.13-draco-meshopt-v1

      - name: Install dependency build tools
        if: steps.ios-bootstrap-cache.outputs.cache-hit != 'true'
        run: |
          brew install \
            autoconf \
            automake \
            bison \
            dos2unix \
            flex \
            libtool \
            meson \
            ninja \
            pkg-config \
            yasm

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build iOS Python 3.13, Draco, and Meshoptimizer
        if: steps.ios-bootstrap-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail

          host_deps_root="$GITHUB_WORKSPACE/work/host-deps"
          deps_build="$GITHUB_WORKSPACE/work/deps-ios-bootstrap"
          download_cmake="$SOURCE_DIR/build_files/build_environment/cmake/download.cmake"
          dependency_cmakelists="$SOURCE_DIR/build_files/build_environment/CMakeLists.txt"

          mkdir -p "$host_deps_root/deps_arm64/Release"
          ln -s "$SOURCE_DIR/lib/macos_arm64/python" \
            "$host_deps_root/deps_arm64/Release/python"

          # The dependency project normally downloads and configures every desktop package.
          # Limit this bootstrap to the exact missing iOS capabilities and Python's direct libs.
          perl -0pi -e '
            s/^download_source\((?!ZLIB\)|PYTHON\)|LIBB2\)|BZIP2\)|FFI\)|LZMA\)|SSL\)|SQLITE\)|DRACO\)|MESHOPTIMIZER\))([A-Z0-9_]+)\)$/# Focused iOS bootstrap skips $1/mg
          ' "$download_cmake"
          test "$(grep -c '^download_source(' "$download_cmake")" -eq 10

          perl -0pi -e '
            s{^(\s*)include\(cmake/([^)]+)\)$}{$1# Focused iOS bootstrap skips cmake/$2}mg;
            s{^(\s*)# Focused iOS bootstrap skips cmake/(check_software|options|versions|download|macros|check_compilers|harvest|ssl|zlib|python|libb2|ffi|sqlite|bzip2|lzma|draco|meshoptimizer)\.cmake$}{$1include(cmake/$2.cmake)}mg
          ' "$dependency_cmakelists"
          test "$(grep -c '^[[:space:]]*include(cmake/' "$dependency_cmakelists")" -eq 17

          cmake \
            -S "$SOURCE_DIR/build_files/build_environment" \
            -B "$deps_build" \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_DEPS_CROSSCOMPILE_BUILDDIR="$host_deps_root" \
            -DCMAKE_DEPS_CROSSCOMPILE_INSTALLDIR="$SOURCE_DIR/lib/macos_arm64" \
            -DHARVEST_TARGET="$SOURCE_DIR/lib/ios_arm64" \
            -DMAKE_THREADS=3 \
            2>&1 | tee "$GITHUB_WORKSPACE/bootstrap-configure.log"

          cmake --build "$deps_build" \
            --target external_python external_draco external_meshoptimizer \
            --parallel 3 \
            2>&1 | tee "$GITHUB_WORKSPACE/bootstrap-build.log"

          for dependency in \
            python \
            ssl \
            ffi \
            sqlite \
            zlib \
            bzip2 \
            lzma \
            libb2 \
            draco \
            meshoptimizer
          do
            test -d "$deps_build/Release/$dependency"
            rsync -a --delete \
              "$deps_build/Release/$dependency/" \
              "$SOURCE_DIR/lib/ios_arm64/$dependency/"
          done

      - name: Verify complete iOS dependency layout
        run: |
          test -x "$SOURCE_DIR/lib/macos_arm64/python/bin/python3.13"
          test -f "$SOURCE_DIR/lib/ios_arm64/python/include/python3.13/Python.h"
          test -f "$SOURCE_DIR/lib/ios_arm64/python/include/python3.13/pyconfig.h"
          test -f "$SOURCE_DIR/lib/ios_arm64/python/lib/libpython3.13.a"
          test -d "$SOURCE_DIR/lib/ios_arm64/python/lib/python3.13"
          test ! -f "$SOURCE_DIR/lib/ios_arm64/python/lib/libpython3.11.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/ssl/lib/libssl.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/ssl/lib/libcrypto.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/ffi/lib/libffi.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/sqlite/lib/libsqlite3.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/zlib/lib/libz.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/bzip2/lib/libbz2.a"
          test -f "$SOURCE_DIR/lib/ios_arm64/lzma/lib/liblzma.a"
          test -n "$(find "$SOURCE_DIR/lib/ios_arm64/draco" -name '*Config.cmake' -print -quit)"
          test -n "$(find "$SOURCE_DIR/lib/ios_arm64/meshoptimizer" -name '*config.cmake' -print -quit)"

          file "$SOURCE_DIR/lib/ios_arm64/python/lib/libpython3.13.a"
          find "$SOURCE_DIR/lib/ios_arm64/draco/lib" -type f \( -name '*.a' -o -name '*.dylib' \) -maxdepth 2 -print
          find "$SOURCE_DIR/lib/ios_arm64/meshoptimizer/lib" -type f \( -name '*.a' -o -name '*.dylib' \) -maxdepth 2 -print

          nm -gU "$SOURCE_DIR/lib/ios_arm64/ssl/lib/libcrypto.a" | \
            grep -Eq '[[:space:]]_EVP_MD_CTX_get_size_ex$'
          nm -gU "$SOURCE_DIR/lib/ios_arm64/ssl/lib/libssl.a" | \
            grep -Eq '[[:space:]]_SSL_SESSION_get_time_ex$'
          nm -gU "$SOURCE_DIR/lib/ios_arm64/ssl/lib/libcrypto.a" | \
            grep -Eq '[[:space:]]_X509_STORE_get1_objects$'
          nm -gU "$SOURCE_DIR/lib/ios_arm64/ffi/lib/libffi.a" | \
            grep -Eq '[[:space:]]_ffi_type_longdouble$'

      - name: Save verified dependency cache
        if: steps.ios-bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/blender/lib/ios_arm64/python
            work/blender/lib/ios_arm64/ssl
            work/blender/lib/ios_arm64/ffi
            work/blender/lib/ios_arm64/sqlite
            work/blender/lib/ios_arm64/zlib
            work/blender/lib/ios_arm64/bzip2
            work/blender/lib/ios_arm64/lzma
            work/blender/lib/ios_arm64/libb2
            work/blender/lib/ios_arm64/draco
            work/blender/lib/ios_arm64/meshoptimizer
          key: ios-5.2-bootstrap-${{ runner.os }}-xcode-26.3-${{ env.BLENDER_REF }}-python-3.13.13-draco-meshopt-v1

      - name: Configure full Blender 5.2 iPad profile
        run: |
          set -o pipefail
          ios_sdk_root="$(xcrun --sdk iphoneos --show-sdk-path)"
          ios_dev_root="$(dirname "$ios_sdk_root")"

          cmake -G Xcode \
            -S "$SOURCE_DIR" \
            -B "$BUILD_DIR" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_FIND_ROOT_PATH="$ios_dev_root;$(dirname "$ios_dev_root");$SOURCE_DIR/lib/ios_arm64" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLENDER_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$SOURCE_DIR/lib/macos_arm64/python/bin/python3.13" \
            -DPYTHON_INCLUDE_DIR="$SOURCE_DIR/lib/ios_arm64/python/include/python3.13" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$SOURCE_DIR/lib/ios_arm64/python/include/python3.13" \
            -DPYTHON_LIBRARY="$SOURCE_DIR/lib/ios_arm64/python/lib/libpython3.13.a" \
            -DPYTHON_LIBPATH="$SOURCE_DIR/lib/ios_arm64/python/lib" \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_METAL=ON \
            -DWITH_CYCLES_EMBREE=ON \
            -DWITH_CYCLES_PATH_GUIDING=ON \
            -DWITH_CODEC_FFMPEG=ON \
            -DWITH_ALEMBIC=ON \
            -DWITH_OPENVDB=ON \
            -DWITH_OPENIMAGEDENOISE=ON \
            -DWITH_USD=ON \
            -DWITH_AUDASPACE=ON \
            -DWITH_COREAUDIO=OFF \
            -DWITH_OPENAL=ON \
            -DWITH_CODEC_SNDFILE=ON \
            -DWITH_DRACO=ON \
            -DWITH_MESHOPTIMIZER=ON \
            -DWITH_OPENSUBDIV=ON \
            -DWITH_INTERNATIONAL=ON \
            -DWITH_HYDRA=OFF \
            -DWITH_XR_OPENXR=OFF \
            2>&1 | tee "$GITHUB_WORKSPACE/cmake-configure.log"

          xcodebuild -project "$BUILD_DIR/Blender.xcodeproj" -list
          bash ./scripts/write-feature-manifest.sh \
            "$BUILD_DIR/CMakeCache.txt" \
            "$ARTIFACT_DIR/Blender-iPad-M4-5.2-feature-manifest.txt"

          {
            echo "Blender source: $BLENDER_REF"
            echo "iOS libraries: $(git -C "$SOURCE_DIR/lib/ios_arm64" rev-parse HEAD)"
            echo "macOS libraries: $(git -C "$SOURCE_DIR/lib/macos_arm64" rev-parse HEAD)"
            echo "Compatibility patch: $(shasum -a 256 patches/ios-5.2-m4-full.patch | awk '{print $1}')"
            echo "Harness commit: $GITHUB_SHA"
          } > "$ARTIFACT_DIR/Blender-iPad-M4-5.2-source-manifest.txt"

      - name: Build complete unsigned device application
        run: |
          set -o pipefail
          xcodebuild \
            -project "$BUILD_DIR/Blender.xcodeproj" \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -jobs 3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            EXPANDED_CODE_SIGN_IDENTITY=- \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package full-memory and Signulous fallback IPAs
        run: |
          cp "$SOURCE_DIR/release/ios/entitlements.plist" \
            "$ARTIFACT_DIR/Blender-iPad-M4-5.2-full-memory-entitlements.plist"

          bash ./scripts/package-ipa.sh \
            "$BUILD_DIR" \
            "$ARTIFACT_DIR/Blender-iPad-M4-5.2-full-memory-unsigned.ipa" \
            full-memory

          bash ./scripts/package-ipa.sh \
            "$BUILD_DIR" \
            "$ARTIFACT_DIR/Blender-iPad-M4-5.2-Signulous-unsigned.ipa" \
            signulous

      - name: Upload unsigned Blender 5.2 build
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-M4-5.2-full
          path: artifacts/**
          if-no-files-found: error
          retention-days: 21

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-M4-5.2-build-diagnostics
          path: |
            bootstrap-configure.log
            bootstrap-build.log
            cmake-configure.log
            xcodebuild.log
            work/build-ios/CMakeCache.txt
            work/build-ios/CMakeFiles/CMakeOutput.log
            work/build-ios/CMakeFiles/CMakeError.log
            artifacts/*manifest.txt
          if-no-files-found: ignore
          retention-days: 21
