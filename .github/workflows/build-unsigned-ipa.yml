name: Build unsigned Blender 5.1.2 iPad IPA

on:
  push:
    branches:
      - main
      - upgrade/ios-5.1.2
    paths:
      - .github/workflows/build-unsigned-ipa.yml
      - scripts/**
  workflow_dispatch:

concurrency:
  group: blender-ipad-m4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Blender 5.1.2 iPad M4 bring-up
    runs-on: macos-15
    timeout-minutes: 240

    env:
      BLENDER_REF: a1de44dd54af75a4c8c4a29a5fed2a1334a87446
      BUNDLE_ID: com.gorillafkngorgeous.blenderipad
      SOURCE_DIR: ${{ github.workspace }}/work/blender
      BUILD_DIR: ${{ github.workspace }}/work/build-ios
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out build harness
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check host tools and capacity
        run: |
          uname -a
          uname -m
          cmake --version
          git lfs version
          df -h

      - name: Prepare pinned Blender iOS 5.1.2 source and libraries
        run: bash ./scripts/prepare-source.sh "$SOURCE_DIR"

      - name: Install Python dependency build tools
        run: |
          brew install \
            autoconf \
            automake \
            bison \
            dos2unix \
            flex \
            libtool \
            meson \
            ninja \
            pkg-config \
            yasm

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build Blender's bundled Python 3.13 for iOS
        run: |
          set -o pipefail

          host_deps_root="$GITHUB_WORKSPACE/work/host-deps"
          python_deps_build="$GITHUB_WORKSPACE/work/deps-ios-python"
          download_cmake="$SOURCE_DIR/build_files/build_environment/cmake/download.cmake"
          dependency_cmakelists="$SOURCE_DIR/build_files/build_environment/CMakeLists.txt"
          python_cmake="$SOURCE_DIR/build_files/build_environment/cmake/python.cmake"

          mkdir -p "$host_deps_root/deps_arm64/Release"
          ln -s "$SOURCE_DIR/lib/macos_arm64/python" \
            "$host_deps_root/deps_arm64/Release/python"
          mkdir -p \
            "$host_deps_root/deps_arm64/Release/python/lib/python3.13"

          # Blender 5.1.2 hard-codes the pre-install CPython build directory for
          # its iOS sysconfig copy. Python 3.13.9 reliably installs that file
          # before this after_install step, so copy from the installed tree.
          perl -0pi -e '
            s{\$\{BUILD_DIR\}/python/src/external_python/build/lib\.darwin-3\.13/}{\$\{LIBDIR\}/python/lib/python3.13/}g
          ' "$python_cmake"

          test "$(grep -Fc '\${LIBDIR}/python/lib/python3.13/' "$python_cmake")" -eq 1

          # Blender's dependency configure normally downloads every supported
          # package before any target is selected. This bootstrap only builds
          # Python, so retain Python and its six direct library dependencies.
          perl -0pi -e '
            s/^download_source\((?!ZLIB\)|PYTHON\)|BZIP2\)|FFI\)|LZMA\)|SSL\)|SQLITE\))([A-Z0-9_]+)\)$/# Python-only iOS bootstrap skips $1/mg
          ' "$download_cmake"

          test "$(grep -c '^download_source(' "$download_cmake")" -eq 7

          # CMake also configures every dependency file even when only the
          # external_python target is requested. Keep the dependency project
          # limited to Python and its direct libraries so unrelated packages
          # cannot require missing host tools such as ISPC.
          perl -0pi -e '
            s{^(\s*)include\(cmake/([^)]+)\)$}{$1# Python-only iOS bootstrap skips cmake/$2}mg;
            s{^(\s*)# Python-only iOS bootstrap skips cmake/(check_software|options|versions|download|macros|check_compilers|harvest|ssl|zlib|python|ffi|sqlite|bzip2|lzma)\.cmake$}{$1include(cmake/$2.cmake)}mg
          ' "$dependency_cmakelists"

          test "$(grep -c '^[[:space:]]*include(cmake/' "$dependency_cmakelists")" -eq 14

          cmake \
            -S "$SOURCE_DIR/build_files/build_environment" \
            -B "$python_deps_build" \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_DEPS_CROSSCOMPILE_BUILDDIR="$host_deps_root" \
            -DCMAKE_DEPS_CROSSCOMPILE_INSTALLDIR="$SOURCE_DIR/lib/macos_arm64" \
            -DHARVEST_TARGET="$SOURCE_DIR/lib/ios_arm64" \
            -DMAKE_THREADS=3 \
            2>&1 | tee "$GITHUB_WORKSPACE/python-deps-configure.log"

          cmake --build "$python_deps_build" \
            --target external_python \
            --parallel 3 \
            2>&1 | tee "$GITHUB_WORKSPACE/python-deps-build.log"

          rsync -a \
            "$python_deps_build/Release/python/" \
            "$SOURCE_DIR/lib/ios_arm64/python/"

      - name: Verify bundled Python 3.13 dependency layout
        run: |
          test -x "$SOURCE_DIR/lib/macos_arm64/python/bin/python3.13"
          test -f "$SOURCE_DIR/lib/ios_arm64/python/include/python3.13/Python.h"
          test -f "$SOURCE_DIR/lib/ios_arm64/python/include/python3.13/pyconfig.h"
          test -f "$SOURCE_DIR/lib/ios_arm64/python/lib/libpython3.13.a"

      - name: Configure Xcode project
        run: |
          cmake -G Xcode \
            -S "$SOURCE_DIR" \
            -B "$BUILD_DIR" \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -DBLENDER_IOS_SKIP_INSTALL_CODESIGN=ON \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$SOURCE_DIR/lib/macos_arm64/python/bin/python3.13" \
            -DPYTHON_INCLUDE_DIR="$SOURCE_DIR/lib/ios_arm64/python/include/python3.13" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$SOURCE_DIR/lib/ios_arm64/python/include/python3.13" \
            -DPYTHON_LIBRARY="$SOURCE_DIR/lib/ios_arm64/python/lib/libpython3.13.a" \
            -DPYTHON_LIBPATH="$SOURCE_DIR/lib/ios_arm64/python/lib" \
            -DWITH_CYCLES=OFF \
            -DWITH_CODEC_FFMPEG=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_USD=OFF \
            -DWITH_HYDRA=OFF \
            -DWITH_INTERNATIONAL=ON \
            -DWITH_XR_OPENXR=OFF \
            -DWITH_OPENSUBDIV=ON

          xcodebuild -project "$BUILD_DIR/Blender.xcodeproj" -list

      - name: Build and install unsigned device application
        run: |
          set -o pipefail
          xcodebuild \
            -project "$BUILD_DIR/Blender.xcodeproj" \
            -target install \
            -configuration Release \
            -sdk iphoneos \
            -jobs 3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          bash ./scripts/package-ipa.sh \
            "$BUILD_DIR" \
            "$ARTIFACT_DIR/Blender-iPad-M4-5.1.2-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-M4-5.1.2-unsigned
          path: artifacts/Blender-iPad-M4-5.1.2-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-M4-5.1.2-build-diagnostics
          path: |
            xcodebuild.log
            python-deps-configure.log
            python-deps-build.log
            work/build-ios/CMakeCache.txt
            work/build-ios/CMakeFiles/CMakeOutput.log
            work/build-ios/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 14
