name: Consolidate repository to main (one time)

on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidate-main-once.yml]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: consolidate-main-once
  cancel-in-progress: false

jobs:
  remove-obsolete-branches:
    if: github.repository == 'gorillaFKNgorgeous/-blender-ipad-M4' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify working main and atomically remove the five authorized branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          import urllib.request

          repo = "gorillaFKNgorgeous/-blender-ipad-M4"
          build81 = "c9b9d486b390333e396ba882b33d9a2b6ae591e1"
          expected = {
              "feature/ipad-mcp-bridge": "5eb6ea1d30b68f27aed3c909dcf40eaffde58898",
              "fix/ios-desktop-input": "682de07baa3e49644d8e7b32605379a69f8e1cde",
              "upgrade/ios-5.1.2": "c0761db2d79be3f5f6729bee120bffa0caac591d",
              "codex/fix-save-functionality-in-blender-5.2-ipad": "bb0b783c490065a6f4bc292a775239f75c21190e",
              "upgrade/ios-5.2-m4-full": "8061daba6dd412141b01f21904d82ad3e6cdea95",
          }
          token = os.environ["GH_TOKEN"]
          run_sha = os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          assert "main" not in expected

          def get(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if 'rel="next"' in response.headers.get("Link", ""):
                      raise RuntimeError("Unexpected pagination; refusing partial branch/PR inventory")
                  return json.load(response)

          assert get("")["default_branch"] == "main"
          branches = {b["name"]: b for b in get("branches?per_page=100")}
          assert branches["main"]["commit"]["sha"] == run_sha, "main advanced; recheck before cleanup"
          assert not (set(branches) - {"main"} - set(expected)), "Unexpected new branch; stop for review"
          assert not get("pulls?state=open&per_page=100"), "An open PR remains; stop before deleting branches"
          ancestry = get("compare/" + build81 + "..." + run_sha)
          assert ancestry["status"] in ("ahead", "identical"), "main does not contain build #81"
          targets = {name: sha for name, sha in expected.items() if name in branches}
          for name, sha in targets.items():
              assert branches[name]["commit"]["sha"] == sha, "Branch advanced: " + name
              assert not branches[name]["protected"], "Branch is protected: " + name

          if targets:
              # The explicit leases prevent deleting a branch that changed after the API check.
              # --atomic makes all five deletions one transaction, leaving main untouched.
              git_env = os.environ.copy()
              auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
              git_env.update({
                  "GIT_TERMINAL_PROMPT": "0",
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                  "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + auth,
              })
              with tempfile.TemporaryDirectory(prefix="branch-cleanup-") as work:
                  subprocess.run(["git", "init", "--bare", "--quiet", work], check=True)
                  command = ["git", "-C", work, "push", "--atomic"]
                  command += ["--force-with-lease=refs/heads/" + name + ":" + sha for name, sha in targets.items()]
                  command += ["https://github.com/" + repo + ".git"]
                  command += [":refs/heads/" + name for name in targets]
                  subprocess.run(command, env=git_env, check=True, timeout=60)

          remaining = get("branches?per_page=100")
          assert [b["name"] for b in remaining] == ["main"], "Cleanup incomplete"
          assert remaining[0]["commit"]["sha"] == run_sha, "main changed during cleanup"
          assert not get("pulls?state=open&per_page=100")
          print("Verified: only main remains; build #81 ancestry retained; zero open pull requests.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Repository consolidated\n\nOnly `main` remains, containing build #81. Zero open pull requests.\n\n")
              for name, sha in targets.items():
                  summary.write("- Deleted `" + name + "` at `" + sha + "`.\n")
          PY
